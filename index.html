<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
           box-sizing:border-box ;
        }
        .container{
            width: 100vw;
            height:100vh;
            background-color: rgb(3, 49, 49);
            display: flex;
            
            justify-content: center;
            text-align: center;
          


        }
        .box{
            width: 310px;
            height: 510px;
            background-color: azure;
            border-radius: 20px;
            margin: auto;
            box-shadow: 15px 15px  20px black;
        


        }
        .box img{
            width: 250px;
            height: 250px;
            margin-top: 20px;
            border-radius: 20px;
            transition: all 0.5s linear 0s;

        }
        .box img:hover{
            transform: scale(0.9);

        }
        .box h2{
            font-size: 3rem;
            font-style:oblique;
            padding-bottom: 10px;
        
        }
        .box p{
            line-height:20px;
            color: black;
            font-size: 1rem;
            font-weight:450;
        }
        .btn{
            margin-top: 5px;
           
           
        }
        .btn button{
            background-color: rgb(24, 94, 198);
            width:5rem;
            border-radius: 5px;
            padding-top: 3px;
            padding-bottom: 2px;
            font-size:14px;
            font-style: oblique;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="img/abt.jpg" alt="">
            <h2>Best place to visit </h2>

            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Asperiores, cumque. A, natus? Eligendi dolore facere cupiditate aliquid similique nisi eaque!

            </p>
            <div class="btn">
                <button>Visit</button>

            </div>
          
        </div>

    </div>
</body>
</html>
