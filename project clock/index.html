<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }
        .clock{
            width: 500px;
            height: 500px;
            position: relative;
            background-color: lightgray;
            border-radius: 50%;
            border: 5px solid lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 0px 10px 10px whitesmoke;
        }
        .number{
            transform: rotate(calc(30deg * var(--n)));
            position: absolute;
            text-align: center;
            inset: 20px;
            font-size: 40px;
        }
        .number b{
            transform: rotate(calc(-30deg * var(--n)));
            display: inline-block;
        }
        .center-dot{
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: black;
            border-radius: 50%;
        }
        .hour-hand,.minute-hand, .second-hand{
            --rotate:0;
            position: absolute;
            left: 50%;
            bottom: 50%;
          
            transform: translate(-50%) rotate(calc(var(--rotate) * 1deg));
            transform-origin: bottom;
        }
        .hour-hand{
            width: 10px;
            height: 130px;
            background-color: black;

        }
        .second-hand{
            width: 5px;
            height: 170px;
            background-color: lightcoral;
        }
        .minute-hand{
            width: 7px;
            height: 170px;
            background-color:lightskyblue ;
        }
        #name{
            font-size: 1.5rem;
            color: rgb(43, 50, 50);
            font-weight:700;
            margin-top: 30px;
            font-style: bold;

        }




        


    </style>



</head>
<body>
 <div class="clock">
    <div class="number" style="--n:1"> <b>.1</b></div>
    <div class="number"style="--n:2"> <b>.2</b></div>
    <div class="number" style="--n:3"><b>.3</b></div>
    <div class="number"style="--n:4"> <b>.4</b></div>
    <div class="number"style="--n:5"><b>.5</b></div>
    <div class="number"style="--n:6"><b> .6</b></div>
    <div class="number"style="--n:7"><b>7.</b></div>
    <div class="number"style="--n:8"><b>8.</b></div>
    <div class="number"style="--n:9"><b>9.</b></div>
    <div class="number"style="--n:10"><b>10.</b></div>
    <div class="number"style="--n:11"><b>11.</b></div>
    <div class="number"style="--n:12"><b>12.</b>
        <br>
        <p id="name">TITAN </p>

    </div>


    <div class="hour-hand" id="hour-hand"></div>
    <div class="minute-hand" id="minute-hand"></div>
    <div class="second-hand" id="second-hand"></div>
    <div class="center-dot"></div>
    
   
   
   
 </div>
 




     <script src="index.js"></script>
</body>
</html>
