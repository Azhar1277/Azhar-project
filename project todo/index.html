<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        font-family:'Popins', sans-serif;
        box-sizing: border-box;

    }
    .container{
        width: 100%;
       min-height:100vh ;
       background-color: rgb(5, 171, 115);
       padding: 10px;

    }
    .todo-app{
        width:100%;
        max-width:540px;
       background-color: #fff;
        border-radius: 15px;
        margin: 100px auto 20px;
        padding: 40px 30px 70px ;
        box-shadow: 10px 8px 10px white;
        border: 1px solid black;

    }
    .todo-app img{
        width: 30px;
        height: 30px;
        margin-left: 10px;


    }
    .row{
       
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content:space-between;
        border-radius: 30px;
        padding-left: 20px;
        background: #edeef0;
        margin-bottom: 25px;
        margin-top: 1rem;


    }
    input{
      flex: 1;
      border: none;
      outline: none;
      background:transparent;
      padding: 10px;
      font-weight: 18px;

       
    } 
       
       button{
        border: none;
        outline: none;
        padding: 16px 50px;
       
        color: #fff;
        background-color: #ff5945;
        font-size:16px;
        cursor: pointer;
        border-radius: 40px;
    }

   



    ul li {
        list-style: none;
        font-size: 20px;
        padding: 12px 8px 12px 40px;
        user-select: none;
        cursor: pointer;
        position: relative;
        margin-top: 1.5rem;
       


    }
   
    
      
    ul li::before{
        content:" ";
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-image: url(images/unchecked.png);
        background-size: cover;
        background-position: center;
        top:12px;
         left: 8px;

    }
    ul li.checked{
        color: #555;
        text-decoration: line-through;
    }
    ul li.checked::before{
        background-image:url(images/checked.png);
    }


      ul li span{
        position: absolute;
        right: 0;
        top: 5px;
        width: 40px;
        height: 40px;
        font-size: 22px;
        color: #555;
        line-height: 40px;
        text-align: center;
        border-radius: 50%;
      }
      ul li span:hover{
        background: #edeef0;

      }





</style>


<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-Do List  <img src="todo.png" alt="">
            </h1>
            <div class="row"> 
                <input type="text" id="input-box" placeholder="Add your text">
                <button onclick="addTask()">Add</button>
            </div>

             <ul id="list-container">
                
        <!--    <li class="checked"> Task1 </li>
                <li>Task2</li>
                <li>Task3</li>-->

            
             

             </ul>
           
           
           
        </div>


    </div>

   <script src="index.js"></script>
    
</body>
</html>
